<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>產品 AI 辨識系統</title>
  <!-- 載入 TensorFlow.js 與 Teachable Machine Image 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
    }
    #webcam-container {
      margin: 20px auto;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      background-color: #eee;
      border-radius: 12px;
      overflow: hidden;
    }
    #webcam-container canvas {
      width: 100% !important;
      height: auto !important;
      max-width: 400px;
      border-radius: 12px;
      display: block;
    }
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(26,115,232,0.3);
      transition: background-color 0.2s;
    }
    .btn:active {
      background-color: #1557b0;
    }
    #result-box {
      margin-top: 20px;
      padding: 15px;
      background: #e8f0fe;
      border-radius: 10px;
    }
    .label-title {
      font-size: 14px;
      color: #5f6368;
    }
    .label-result {
      font-size: 22px;
      font-weight: bold;
      color: #1967d2;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>產品 AI 辨識系統</h2>
    <p>點擊下方按鈕啟動手機鏡頭進行實時辨識</p>
    
    <button class="btn" type="button" onclick="init()">啟動相機</button>
    
    <div id="webcam-container"></div>
    
    <div id="result-box">
      <div class="label-title">最高信心度辨識結果：</div>
      <div id="label-container" class="label-result">尚未啟動</div>
    </div>
  </div>

  <script type="text/javascript">
    // Teachable Machine 模型網址
    const URL = "https://teachablemachine.withgoogle.com/models/d_OKWF-Q_/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "模型載入中，請稍候...";

        try {
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = false; 
            const width = 400;
            const height = 400;
            webcam = new tmImage.Webcam(width, height, flip);
            
            // 使用手機後置鏡頭
            await webcam.setup({ facingMode: "environment" }); 
            await webcam.play();
            
            window.requestAnimationFrame(loop);

            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.innerHTML = "";
            webcamContainer.appendChild(webcam.canvas);
        } catch (error) {
            console.error(error);
            labelContainer.innerHTML = "無法啟動鏡頭或模型載入失敗";
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        
        let topPrediction = prediction[0];
        for (let i = 1; i < maxPredictions; i++) {
            if (prediction[i].probability > topPrediction.probability) {
                topPrediction = prediction[i];
            }
        }

        const confidence = (topPrediction.probability * 100).toFixed(1);
        labelContainer.innerHTML = `${topPrediction.className} (${confidence}%)`;
    }
  </script>
</body>
</html>
